<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>Brain Desk</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="drag"></div>
    <div class="brand"><div class="mark">CB</div><div><b>Brain Desk</b><small id="vaultName">canaan-brain</small></div></div>
    <button class="qa" id="qaBtn">＋ Quick add <span class="kbd">N</span></button>
    <nav class="nav" id="nav">
      <div class="nav-label">Work</div>
      <button data-view="today"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg>Today<span class="badge hot" id="b-today"></span></button>
      <button data-view="follow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4.5h11M2.5 8h7M2.5 11.5h9"/></svg>Follow-ups<span class="badge" id="b-follow"></span></button>
      <button data-view="inbound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 9.5l1.8-5.2c.2-.5.6-.8 1.1-.8h6.2c.5 0 .9.3 1.1.8L14 9.5v2.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9.5h3.5l1 1.5h3l1-1.5H14"/></svg>Inbound<span class="badge" id="b-inbound"></span></button>
      <button data-view="sheet"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>Deal sheet<span class="badge" id="b-sheet"></span></button>
      <div class="nav-label">Records</div>
      <button data-view="people"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.3 2.3-3.5 4.5-3.5s3.9 1.2 4.5 3.5M11 3.2a2.5 2.5 0 0 1 0 4.6M12.5 10.3c1 .5 1.7 1.6 2 3.2"/></svg>People<span class="badge" id="b-people"></span></button>
    </nav>
    <div class="side-foot">
      <button class="ext-cta" id="extHelp"><b>Chrome button</b>Set up logging from LinkedIn and company sites.</button>
      <label class="login-item"><input type="checkbox" id="loginItem"> Open at login</label>
      <div class="sync" id="sync"><i></i><span>Vault in sync</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Today</h1>
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>
        <input id="search" placeholder="Search people and companies   ⌘K" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="setup" id="setup" hidden>
  <div class="setup-card">
    <div class="mark big">CB</div>
    <h1>Connect your vault</h1>
    <p>Brain Desk reads and writes the notes in your canaan-brain vault, then commits and pushes each change to GitHub.</p>
    <div id="setupBody"></div>
    <p class="setup-err" id="setupErr" hidden></p>
  </div>
</div>

<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
